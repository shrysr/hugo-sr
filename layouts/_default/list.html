{{ define "main" -}}
<main class="main layout__main">
<header>
<h1 class="title">{{ .Title }}</h1>
</header>

{{ .Content }}

<div class="archive-year">
    <ul>
        {{ $paginator := .Paginate (.Pages) -}}
        {{ range $paginator.Pages -}}
        {{ .Render "summary" }}
        {{ end -}}
    </ul>
</div>

{{ partial "pagination-lite.html" . }}
</main>
{{ end -}}
